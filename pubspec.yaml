name: moodmatch_mobile_app
description: Mood-based recommendations mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: 3.3.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  shared_preferences: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
